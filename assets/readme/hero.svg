    <text x="20" y="58" fill="#f5f0e8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="48" font-weight="700">strategy-prompts</text>
    <text x="20" y="100" fill="#d5dee8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="22" font-weight="500">전략부터 슬라이드까지, 복사해서 바로 쓰는</text>
    <text x="20" y="132" fill="#d5dee8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="22" font-weight="500">한국어 업무 프레임워크 63개</text>
    <text x="20" y="172" fill="#9aa8b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="17">ChatGPT GPT-5.6 · Claude Opus 5 · Gemini 3.7 Flash</text>

