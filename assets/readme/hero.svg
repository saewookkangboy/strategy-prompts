    <text x="79" y="218" text-anchor="middle" fill="#7eb8ff" font-family="ui-monospace, Menlo, monospace" font-size="13">GPT-5.6 Sol</text>
    <rect x="148" y="196" width="96" height="34" rx="17" fill="#1a2433" stroke="#334155" stroke-width="1"/>
    <text x="196" y="218" text-anchor="middle" fill="#d4a574" font-family="ui-monospace, Menlo, monospace" font-size="13">Opus 5</text>
    <rect x="254" y="196" width="136" height="34" rx="17" fill="#1a2433" stroke="#334155" stroke-width="1"/>
    <text x="322" y="218" text-anchor="middle" fill="#8fd4a8" font-family="ui-monospace, Menlo, monospace" font-size="13">Gemini 3.7 Flash</text>

    <!-- motif line -->
    <text x="20" y="278" fill="#6b7d90" font-family="ui-monospace, Menlo, monospace" font-size="14">복사 → [ ] 채우기 → 실행 → 8-x3 검증</text>
    <text x="20" y="310" fill="#e8a838" font-family="ui-monospace, Menlo, monospace" font-size="14">NEW  6-4 → 6-5 → 6-6 → 6-7 → 6-8 → 6-9</text>
    <text x="20" y="336" fill="#8fa3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="15">리서치 · 마이닝 · 보고서 · 덱 · 디자인 · 도식</text>
  </g>

