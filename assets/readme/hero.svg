<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">strategy-prompts — 전략·마케팅·기획·PR·리서치 프롬프트 라이브러리</title>
  <desc id="desc">한국어 해요체 업무 프레임워크 63개. ChatGPT GPT-5.6, Claude Opus 5, Gemini 3.7 Flash에서 복사해 사용. 프롬프트 블록과 리서치→보고서→슬라이드 체인을 보여 줍니다.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1016"/>
      <stop offset="100%" stop-color="#152030"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#ffffff" fill-opacity="0.05"/>
    </pattern>
  </defs>
  <rect width="1200" height="400" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="400" rx="28" fill="url(#dots)"/>

  <!-- left: identity -->
  <g transform="translate(56 48)">
